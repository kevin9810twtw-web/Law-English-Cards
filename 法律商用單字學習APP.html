<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法律商用單字學習卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#f4f4f6;font-family:Georgia,serif;}
body{display:flex;flex-direction:column;height:100dvh;padding:12px 14px 10px;overflow:hidden;}

#progress-bar-wrap{flex-shrink:0;margin-bottom:10px;}
#progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
#progress-text{font-size:11px;color:#9ca3af;font-family:monospace;}
#reset-btn{background:none;border:none;cursor:pointer;color:#d1d5db;padding:2px;line-height:1;font-size:18px;}
#reset-btn:hover{color:#6b7280;}
#progress-track{height:3px;background:#e5e7eb;border-radius:99px;overflow:hidden;}
#progress-fill{height:100%;background:#1a1b26;border-radius:99px;transition:width .4s ease;width:0%;}

#card-wrap{flex:1;min-height:0;perspective:1200px;margin-bottom:10px;}
#card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
#card-inner.flipped{transform:rotateY(180deg);}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:#fff;border:1px solid #ebebf0;box-shadow:0 2px 16px rgba(0,0,0,.06);}
#front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;cursor:pointer;}
#back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:16px;}

#front-label{font-size:10px;font-weight:700;letter-spacing:.18em;color:#6558f5;text-transform:uppercase;margin-bottom:14px;font-family:monospace;}
#front-word{font-size:clamp(1.5rem,6vw,2.6rem);font-weight:900;color:#1a1b26;text-align:center;line-height:1.2;margin-bottom:8px;word-break:break-word;}
#front-ipa{font-family:monospace;color:#9ca3af;font-size:clamp(.75rem,3vw,.95rem);margin-bottom:6px;letter-spacing:.03em;}
#front-pos{font-size:13px;color:#a78bfa;font-style:italic;margin-bottom:22px;}
#play-btn-front{width:56px;height:56px;border-radius:50%;background:#f0f0fd;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6558f5;}
#play-btn-front:active{background:#e0e7ff;}
#front-hint{font-size:11px;color:#d1d5db;margin-top:14px;}

#back-info{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
#back-word{font-size:clamp(1.2rem,5vw,2rem);font-weight:800;color:#1a1b26;margin-bottom:4px;word-break:break-word;}
#back-ipa{font-family:monospace;color:#9ca3af;font-size:clamp(.7rem,2.5vw,.88rem);margin-bottom:8px;letter-spacing:.03em;}
#back-meta{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
#back-pos{font-size:13px;font-style:italic;color:#a78bfa;}
#back-trans{font-size:clamp(1rem,4vw,1.35rem);font-weight:700;color:#374151;}
#back-ex-box{background:#f9fafb;border-radius:16px;padding:12px 16px;width:100%;border:1px solid #f3f4f6;margin-bottom:10px;}
#back-ex{color:#6b7280;font-size:clamp(.78rem,3vw,.93rem);line-height:1.6;font-style:italic;}
#play-btn-back{background:#f0f0fd;border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#6558f5;cursor:pointer;}
#play-btn-back:active{background:#e0e7ff;}

#btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0;margin-top:10px;}
.action-btn{border:none;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;}
.action-btn:active{filter:brightness(1.12);transform:scale(.97);}
.btn-label{color:#fff;font-weight:800;font-size:clamp(1.1rem,5vw,1.45rem);line-height:1;}
.btn-sub{color:rgba(255,255,255,.85);font-size:11px;margin-top:4px;}

#stats-bar{display:flex;justify-content:center;gap:20px;flex-shrink:0;}
.stat-dot{display:flex;align-items:center;gap:5px;font-size:11px;color:#9ca3af;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

#done-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100dvh;text-align:center;padding:24px;position:fixed;inset:0;background:#f4f4f6;}
</style>
</head>
<body>

<div id="done-screen">
  <div style="font-size:52px;margin-bottom:16px;">&#127881;</div>
  <h2 style="font-size:22px;font-weight:800;color:#1a1b26;margin-bottom:8px;">全部學習完成！</h2>
  <p style="font-size:13px;color:#9ca3af;margin-bottom:32px;">今天的單字都已經背熟了</p>
  <button id="restart-btn" style="display:flex;align-items:center;gap:8px;padding:12px 28px;background:#1a1b26;color:#fff;border:none;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;">&#8635; 重新開始</button>
</div>

<div id="progress-bar-wrap">
  <div id="progress-info">
    <span id="progress-text">1 / 206</span>
    <button id="reset-btn" title="重置進度">&#8635;</button>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="card-wrap">
  <div id="card-inner">
    <div class="face" id="front">
      <span id="front-label">FLASHCARD</span>
      <h1 id="front-word"></h1>
      <p id="front-ipa"></p>
      <p id="front-pos"></p>
      <button id="play-btn-front" title="播放發音">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <p id="front-hint">點擊卡片查看答案</p>
    </div>
    <div class="face" id="back">
      <div id="back-info">
        <h2 id="back-word"></h2>
        <p id="back-ipa"></p>
        <div id="back-meta">
          <span id="back-pos"></span>
          <span id="back-trans"></span>
        </div>
        <div id="back-ex-box"><p id="back-ex"></p></div>
        <button id="play-btn-back" title="重新播放">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
      <div id="btns">
        <button class="action-btn" style="background:#F04557;" data-action="again"><span class="btn-label">Again</span><span class="btn-sub">馬上重複</span></button>
        <button class="action-btn" style="background:#F39B1A;" data-action="hard"><span class="btn-label">Hard</span><span class="btn-sub">5張內重複</span></button>
        <button class="action-btn" style="background:#1EB469;" data-action="good"><span class="btn-label">Good</span><span class="btn-sub">排至後段</span></button>
        <button class="action-btn" style="background:#6164F4;" data-action="easy"><span class="btn-label">Easy</span><span class="btn-sub">今日移除</span></button>
      </div>
    </div>
  </div>
</div>

<div id="stats-bar">
  <span class="stat-dot"><span class="dot" style="background:#F04557;"></span><span id="st-again">0</span></span>
  <span class="stat-dot"><span class="dot" style="background:#F39B1A;"></span><span id="st-hard">0</span></span>
  <span class="stat-dot"><span class="dot" style="background:#1EB469;"></span><span id="st-good">0</span></span>
  <span class="stat-dot"><span class="dot" style="background:#6164F4;"></span><span id="st-easy">0</span></span>
</div>

var deck,stats,isFlipped;

function loadState(){
  try{
    var d=localStorage.getItem('fc_deck4');
    var s=localStorage.getItem('fc_stats4');
    deck=d?JSON.parse(d):[].concat(CARDS);
    stats=s?JSON.parse(s):{again:0,hard:0,good:0,easy:0};
  }catch(e){
    deck=[].concat(CARDS);
    stats={again:0,hard:0,good:0,easy:0};
  }
  isFlipped=false;
}

function saveState(){
  localStorage.setItem('fc_deck4',JSON.stringify(deck));
  localStorage.setItem('fc_stats4',JSON.stringify(stats));
}

var currentAudio=null;
function playWord(){
  if(!deck.length)return;
  var word=deck[0].word;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  var url='https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(word)+'&tl=en&client=gtx';
  var audio=new Audio(url);
  currentAudio=audio;
  audio.play().catch(function(){
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(word);
      u.lang='en-US';u.rate=0.85;
      window.speechSynthesis.speak(u);
    }
  });
}

function render(){
  var total=CARDS.length;
  var done=total-deck.length;
  if(!deck.length){
    document.getElementById('done-screen').style.display='flex';
    document.getElementById('progress-bar-wrap').style.display='none';
    document.getElementById('card-wrap').style.display='none';
    document.getElementById('stats-bar').style.display='none';
    return;
  }
  document.getElementById('done-screen').style.display='none';
  document.getElementById('progress-bar-wrap').style.display='block';
  document.getElementById('card-wrap').style.display='block';
  document.getElementById('stats-bar').style.display='flex';

  var c=deck[0];
  document.getElementById('progress-text').textContent=(done+1)+' / '+total;
  document.getElementById('progress-fill').style.width=(done/total*100)+'%';
  document.getElementById('front-word').textContent=c.word;
  document.getElementById('front-ipa').textContent=c.ipa;
  document.getElementById('front-pos').textContent=c.pos;
  document.getElementById('back-word').textContent=c.word;
  document.getElementById('back-ipa').textContent=c.ipa;
  document.getElementById('back-pos').textContent=c.pos;
  document.getElementById('back-trans').textContent=c.trans;
  document.getElementById('back-ex').textContent='\u201c'+c.ex+'\u201d';
  var inner=document.getElementById('card-inner');
  if(isFlipped)inner.classList.add('flipped');
  else inner.classList.remove('flipped');
  document.getElementById('st-again').textContent=stats.again;
  document.getElementById('st-hard').textContent=stats.hard;
  document.getElementById('st-good').textContent=stats.good;
  document.getElementById('st-easy').textContent=stats.easy;
}

function doAction(type){
  if(!deck.length)return;
  var card=deck[0];
  deck=deck.slice(1);
  if(type==='again'){stats.again++;deck.splice(Math.min(1,deck.length),0,card);}
  else if(type==='hard'){stats.hard++;var hi=Math.floor(Math.random()*Math.min(5,deck.length))+1;deck.splice(hi,0,card);}
  else if(type==='good'){stats.good++;var mid=Math.floor(deck.length/2);var gi=mid+Math.floor(Math.random()*(deck.length-mid+1));deck.splice(Math.min(gi,deck.length),0,card);}
  else if(type==='easy'){stats.easy++;}
  isFlipped=false;
  saveState();
  render();
}

function doReset(){
  if(confirm('確定要重置所有進度嗎？')){
    deck=[].concat(CARDS);
    stats={again:0,hard:0,good:0,easy:0};
    isFlipped=false;
    saveState();
    render();
  }
}

document.getElementById('front').addEventListener('click',function(){
  if(!isFlipped){isFlipped=true;render();}
});
document.getElementById('play-btn-front').addEventListener('click',function(e){e.stopPropagation();playWord();});
document.getElementById('play-btn-back').addEventListener('click',function(e){e.stopPropagation();playWord();});
document.getElementById('reset-btn').addEventListener('click',doReset);
document.getElementById('restart-btn').addEventListener('click',doReset);

document.querySelectorAll('.action-btn').forEach(function(btn){
  btn.addEventListener('click',function(e){e.stopPropagation();doAction(btn.dataset.action);});
});

document.addEventListener('keydown',function(e){
  if(!deck.length)return;
  if(e.code==='Space'){e.preventDefault();isFlipped=!isFlipped;render();}
  if(isFlipped){
    if(e.key==='1')doAction('again');
    if(e.key==='2')doAction('hard');
    if(e.key==='3')doAction('good');
    if(e.key==='4')doAction('easy');
  }
});

loadState();
render();
</script>
